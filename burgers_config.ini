; burgers.py: the same EDMD-DL / ResDMD dictionary model as train.py, on the
; 1D Burgers dataset (one trajectory, 41 nodes on [0,1] x 40 snapshots on
; [0,1], square-wave initial condition). The field goes in as a
; (T, C=1, H=1, W=41) "image", so DictionaryNet's conv body runs unchanged
; (3x3 kernels on a height-1 field act as 1D convolutions along x).

[DATA]
data_dir = /expanse/lustre/projects/ucd252/kringel/burgers
; contiguous time split of the 40 snapshots: 28 train / 6 val / 6 test
train_frac = 0.7
val_frac = 0.15
; one scalar mean/std from the training snapshots (no climatology; the
; x=0 boundary node is identically 0, so per-pixel std would be 0 there)

[MODEL]
n_dict = 16
latent_dim = 32
depth = 3
include_state = False
train_ridge = 0.01
eval_ridge = 0.01
compute_readout = True
lookback = 1

[LOSS]
loss_type = combined
oneshot_lags = [1]
psi_weight = 1.0
recon_weight = 1.0
forecast_weight = 1.0
resdmd_eps = 1e-8
resdmd_loss_threshold = 100.0
resdmd_use_cond_penalty = True
resdmd_penalty_coef = 1.0
resdmd_weight = 1.0
resdmd_lag = 1

[TRAINING]
epochs = 3000
lr = 0.001
; 0 = full batch (all 26 training windows -> one K per step)
batch_size = 0
rollout_steps = 2
; ReduceLROnPlateau patience in epochs (train.py uses 5; with one
; full-batch step per epoch that halves the LR far too quickly)
lr_patience = 100
seed = 0
log_every = 100

[EVAL]
resid_tol = 0.5
n_modes = 6
; rank of the plain-DMD baseline on the same normalized state (0 = n_dict)
dmd_rank = 0

[OUTPUT]
dir = /expanse/lustre/scratch/kringel/temp_project/20261106_burgers/dict16
