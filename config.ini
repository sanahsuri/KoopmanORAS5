[DATA]
zarr_path = /expanse/lustre/projects/ucd245/ssuri/pacific_crop/
vars = ['sosstsst']
start = 1979-01
end   = 2018-01
smooth_window = 1
train_frac = 0.7
val_frac = 0.15
; contiguous time split: first train_frac of months = train, next val_frac =
; val, rest = test. Climatology and normalization stats use train months only.

[MODEL]
n_dict = 128
latent_dim = 64
include_state = False
train_ridge = 0.01
eval_ridge = 0.01
compute_readout = True
lookback = 1
; number of trailing months stacked as extra input channels per dictionary
; call (delay embedding) -- 1 = current behavior (single frame, no lookback).

[EVAL]
resid_tol = 0.5
; ResDMD residual above this -> flagged as likely spurious (diagnostic only, not a filter)

[VIZ]
phase_sweep_modes = [1, 2, 3, 5]
; resdmd_visualize.py: which amplitude-ranked modes (1-indexed, matching the
; "mode N" plot titles) get a mode_phase_sweep_modeN.png -- each shows that
; one mode's spatial pattern swept through its own oscillation cycle in
; 15-degree steps, unlike koopman_modes.png which shows several modes at a
; single fixed phase each.

[MODECOMPARISON]
modes_dir = /expanse/lustre/projects/ucd250/kringel/modes
known_modes = ['enso', 'pdo', 'sam', 'nao', 'amo']
discovered_modes = [2, 5]
max_lag_months = 3

[LOSS]
loss_type = combined
; edmd_dl or resdmd_batch or combined
oneshot_lags = [1]
; each lag gets its own direct (non-compounded) Koopman fit from this
; batch's lag-N-apart psi pairs, scored in psi space and, via C_readout,
; state space, against psi_all[:,0] advanced once through that lag's
; operator. TRAINING.rollout_steps must be >= max(oneshot_lags).
psi_weight = 1.0
recon_weight = 1.0
; autoencoder-style: psi_all decoded back to the same frame it came from
forecast_weight = 1.0
; state-space error of each one-shot lag's *predicted* frame vs the true
; future frame
resdmd_eps = 1e-8
resdmd_loss_threshold = 100.0
resdmd_use_cond_penalty = True
resdmd_penalty_coef = 1.0
resdmd_weight = 1.0
; only used when loss_type = combined: edmd_dl_loss + resdmd_weight * resdmd_batch_loss
resdmd_lag = 1
; K becomes a lag-step transition operator; lag=1 is the original one-step residual.
; window length (TRAINING.rollout_steps + 1) must exceed this value.

[TRAINING]
epochs           = 100
lr               = 0.001
batch_size       = 16
checkpoint_every = 10
rollout_steps    = 12

[OUTPUT]
dir = ./runs/dict128_modecollapse_fix