[DATA]
; zarr_path = /expanse/lustre/projects/ucd245/ssuri/pacific_crop/opa1/sosstsst_p.zarr
zarr_path = /expanse/lustre/projects/ucd245/ssuri/pacific_crop/
vars = ['sosstsst']
start = 1979-01
end   = 2014-01
smooth_window = 25

[MODEL]
n_dict = 8
latent_dim = 64
include_state = False
train_ridge = 1e-2
eval_ridge = 1e-2
compute_readout = True

[EVAL]
resid_tol = 0.5     
; ResDMD residual above this -> flagged as likely spurious (diagnostic only, not a filter)

[LOSS]
loss_type = combined
; edmd_dl or resdmd_batch or combined
rollout_steps = 5
; >1 enables multi-step consistency term below
rollout_weight = 0.3
recon_weight = 0.0
resdmd_eps = 1e-8
resdmd_loss_threshold = 10.0
resdmd_use_cond_penalty = True
resdmd_penalty_coef = 1.0
resdmd_weight = 1.0
; only used when loss_type = combined: edmd_dl_loss + resdmd_weight * resdmd_batch_loss

[TRAINING]
rollout_steps    = 5
epochs           = 100
lr               = 0.001
batch_size       = 32
w_rec            = 1.0
w_pred           = 0.5
w_lin            = .3
checkpoint_every = 10

[OUTPUT]
dir = ./dict8_combinedloss